name: ci

on:
  push:
    branches: [boss,init]
  pull_request:
    branches: [boss]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: install dependency
        run: npm install

      - name: run test
        # Fix: Call 'jest' directly and pass the flag via NODE_OPTIONS
        run: npx jest em.test.js
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
