name: ci

on:
  push:
    branches: [boss, init]
  pull_request:
    branches: [boss]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # This tells EVERY step to run inside your backend folder
    defaults:
      run:
        working-directory: ./sbrn-backend

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: install dependency
        run: npm install

      - name: run test
        run: npx jest em.test.js
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
